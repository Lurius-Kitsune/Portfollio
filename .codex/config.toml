[agents]
enabled = true
max_threads = 3

[agents.feature_implementer]
description = "Implements one requested Symfony portfolio feature on its own feature branch, respecting AGENTS.md and human approval for personal or sensitive data."
config_file = "agents/feature-implementer.toml"

[agents.security_reviewer]
description = "Read-only reviewer for security, correctness, migrations, and regressions. Reports actionable findings with file and line references; never changes files."
config_file = "agents/security-reviewer.toml"

[agents.pr_author]
description = "Prepares a Conventional Commit message and a concise pull request title/body from an already-reviewed feature branch. Does not merge, deploy, or publish personal data."
config_file = "agents/pr-author.toml"
