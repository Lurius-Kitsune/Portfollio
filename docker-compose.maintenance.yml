services:
  maintenance:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "4433:443"
    volumes:
      - ./docker/maintenance/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/maintenance/index.html:/usr/share/nginx/html/index.html:ro
      - ssl_certs:/etc/letsencrypt:ro

volumes:
  ssl_certs:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-portfollio}_ssl_certs
