version: "3.9"

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"

    volumes:
      - ./web:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  php:
    build: ./docker

    volumes:
      - ./web:/var/www

    ports:
      - "9000:9000"
    depends_on:
      - database

  database:
    image: postgres:17

    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
