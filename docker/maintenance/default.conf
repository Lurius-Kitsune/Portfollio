server {
    listen 80;
    server_name _;
    return 503;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/lucasfox.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucasfox.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    error_page 503 /index.html;

    location = /index.html { internal; }
    location / { return 503; }
}
