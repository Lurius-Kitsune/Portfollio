map $uri $maintenance_locale {
    ~^/en(?:/|$) en;
    default fr;
}

server {
    listen 80;
    server_name portfolio.lucasfox.eu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portfolio.lucasfox.eu;

    ssl_certificate     /etc/letsencrypt/live/lucasfox.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucasfox.eu/privkey.pem;

    client_max_body_size 50M;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/portfolio/public;
    index index.php;
    set $maintenance_mode ${MAINTENANCE_MODE};
    error_page 503 =503 /maintenance/$maintenance_locale.html;

    location ~ ^/maintenance/(fr|en)\.html$ {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        if ($maintenance_mode = 1) {
            return 503;
        }

        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass php:9000;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ \.php$ {
        try_files $uri /index.php$is_args$args;
    }
}
