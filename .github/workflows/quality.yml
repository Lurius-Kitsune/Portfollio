name: Quality checks

on:
  pull_request:
    branches:
      - build/1.1.4
  push:
    branches:
      - build/1.1.4

permissions:
  contents: read

jobs:
  php:
    name: PHP and Symfony
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip, gd
          tools: composer:v2
          coverage: none
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: web/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('web/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        working-directory: web
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer configuration
        working-directory: web
        run: composer validate --no-check-publish
      - name: Check Symfony container
        working-directory: web
        env:
          APP_ENV: test
          APP_SECRET: ci-only-secret-not-for-production
          DATABASE_URL: 'postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio?serverVersion=17&charset=utf8'
        run: php bin/console lint:container

  frontend:
    name: Encore production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend assets
        working-directory: web
        run: npm run build
