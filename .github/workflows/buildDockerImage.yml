name: "Docker Build"

on:
  workflow_call:
    inputs:
      push:
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "⚒️ Build (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    outputs:
      owner: ${{ steps.downcase.outputs.owner }}

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v6

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: downcase REPO
        id: downcase
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=${OWNER}" >>${GITHUB_ENV}
          echo "owner=${OWNER}" >>${GITHUB_OUTPUT}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sanitize platform for filename
        run: |
          echo "PLATFORM_SLUG=$(echo ${{ matrix.platform }} | tr '/' '-')" >>${GITHUB_ENV}

      - name: Build (and push digest if needed)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: ${{ inputs.push && format('type=image,name=ghcr.io/{0}/portfolio,push-by-digest=true,name-canonical=true,push=true', env.OWNER) || 'type=cacheonly' }}

      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "🔗 Merge manifests"
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          OWNER="${{ needs.build.outputs.owner }}"
          docker buildx imagetools create \
            -t ghcr.io/${OWNER}/portfolio:latest \
            -t ghcr.io/${OWNER}/portfolio:${{ github.sha }} \
            $(printf "ghcr.io/${OWNER}/portfolio@sha256:%s " $(ls))

      - name: Inspect image
        run: |
          OWNER="${{ needs.build.outputs.owner }}"
          docker buildx imagetools inspect ghcr.io/${OWNER}/portfolio:latest