version: "3.9"

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./web/public:/var/www/portfolio/public

    depends_on:
      - php

  php:
    image: ghcr.io/lurius-kitsune/portfolio:latest

    ports:
      - "9000:9000"
    depends_on:
      - database

  database:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
