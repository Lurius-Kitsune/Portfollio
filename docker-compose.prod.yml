version: "3.9"

services:
  nginx:
    image: nginx:alpine 
    ports:
      - "8080:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - portfolio_public:/var/www/portfolio/public:ro

    depends_on:
      - php

  php:
    image: ghcr.io/lurius-kitsune/portfolio:latest

    environment:
      DATABASE_URL: DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"

    command: >
      sh -c "
        php bin/console doctrine:migrations:migrate --no-interaction
        && php-fpm
      "

    ports:
      - "9000:9000"

    volumes:
      - portfolio_public:/var/www/portfolio/public

    depends_on:
      database:
            condition: service_healthy

  database:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 5s
        timeout: 5s
        retries: 10

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  portfolio_public:
  postgres_data:
