version: "3.9"

services:

  cert-init:
    image: certbot/dns-cloudflare
    volumes:
      - ssl_certs:/etc/letsencrypt
      - ./cloudflare.ini:/cloudflare.ini:ro
    command:
    - certonly
    - --dns-cloudflare
    - --dns-cloudflare-credentials
    - /cloudflare.ini
    - --dns-cloudflare-propagation-seconds
    - "60"
    - --non-interactive
    - --agree-tos
    - -m
    - ${EMAIL_ADDRESS}
    - -d
    - ${DOMAIN_NAME}
    

  nginx:
    restart: unless-stopped
    image: nginx:alpine 
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - portfolio_public:/var/www/portfolio/public:ro
      - ssl_certs:/etc/letsencrypt:ro
    depends_on:
      - php

  php:
    restart: unless-stopped
    image: ghcr.io/lurius-kitsune/portfolio:latest

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      APP_ENV: prod
      APP_DEBUG: "0"

    command: >
      sh -c "
        php bin/console doctrine:migrations:migrate --no-interaction &&
        php bin/console cache:warmup --env=prod &&
        exec php-fpm
      "

    ports:
      - "9000:9000"

    volumes:
      - portfolio_public:/var/www/portfolio/public

    depends_on:
      database:
            condition: service_healthy

  database:
    restart: unless-stopped
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
        interval: 10s
        timeout: 10s
        retries: 10

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  portfolio_public:
  postgres_data:
  ssl_certs:
