about:
    title: "À propos de moi"
    presentation: "Depuis tout petit, j’ai été baigné par l’informatique et les nouvelles technologies avec pour rêves d’être développeur dans les jeux vidéo. \n Je ne sais pas encore où cette aventure professionnelle m’amènera, mais je ferais tout afin d’atteindre mon rêve !"
    description: "Game Developer spécialisé en UI (Interface Utilisateur), je suis particulièrement passionné par la conception d’interfaces intuitives, fonctionnelles et immersives au service de l’expérience joueur. Curieux et constamment en quête de progression, je cherche régulièrement de nouvelles opportunités pour développer mes compétences, approfondir mes connaissances et découvrir de nouvelles approches dans le domaine de l’UI et du développement de jeux vidéo."
    citation: "« La vie mérite d'être d'être aimé. »"
